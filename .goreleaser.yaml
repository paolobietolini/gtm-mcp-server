version: 2

project_name: gtm-mcp-server

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: .
    binary: gtm-mcp-server
    env:
      - CGO_ENABLED=0
    goos: &goos
      - linux
      - darwin
      - windows
    goarch: &goarch
      - amd64
      - arm64
    ldflags:
      - -s -w
  - id: cli
    main: ./cmd/gtm-cli
    binary: gtm-cli
    env:
      - CGO_ENABLED=0
    goos: *goos
    goarch: *goarch
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: server
    ids:
      - server
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: cli
    ids:
      - cli
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "gtm-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
